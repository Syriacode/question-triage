[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "question-triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls a real local Ollama model (run with: pytest -m live)",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
